[package]
name = "laires"
version = "0.1.0"
edition = "2024"
description = "An agentic writing tool powered by narrative graph intelligence"
license = "MIT"
repository = "https://github.com/justingibbs/laires"
homepage = "https://github.com/justingibbs/laires"
readme = "README.md"
authors = ["Justin Gibbs <justingibbs@gmail.com>"]
keywords = ["writing", "fiction", "narrative", "llm", "screenwriting"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Text storage
ropey = "1"

# Graph
petgraph = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for LLM APIs
reqwest = { version = "0.12", features = ["json", "stream"] }

# Text search
regex = "1"

# Hashing (content change detection)
blake3 = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async streams (for LLM streaming)
futures = "0.3"
tokio-stream = "0.1"

# SSE parsing (for streaming API responses)
eventsource-stream = "0.2"

# TUI
ratatui = "0.29"
crossterm = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

# GUI
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.33"
egui_commonmark = "0.22"
rfd = "0.17"
dirs = "6"

[dev-dependencies]
tempfile = "3.25.0"
